project_id = "healthbuddy"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/recovery"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.hook.before_user_created]
# Temporarily disable only for trusted initial-admin bootstrap, then restore true.
# Hosted activation is a separate Dashboard operation.
enabled = true
uri = "pg-functions://postgres/private/before_user_created"

# Google credentials and callback URLs will be configured in the auth phase.
# Auth identities never provision application profiles automatically.
